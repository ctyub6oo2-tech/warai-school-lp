<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Instagram carousel slide 07: いつもと違う行動を 1ミリ選ぶ</title>
  <desc id="desc">「自分を変えるたった一つの方法」をテーマにしたInstagram投稿画像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="55%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#eef7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="940" cy="145" r="170" fill="#59b6b0" opacity="0.18"/>
  <circle cx="125" cy="1140" r="210" fill="#59b6b0" opacity="0.14"/>
  <circle cx="855" cy="1110" r="26" fill="#59b6b0" opacity="0.55"/>
  <circle cx="906" cy="1170" r="12" fill="#1f2937" opacity="0.18"/>
  <rect x="90" y="115" width="900" height="1120" rx="54" fill="#ffffff" opacity="0.90" filter="url(#shadow)"/>
  <rect x="90" y="115" width="900" height="1120" rx="54" fill="none" stroke="#59b6b0" stroke-width="4" opacity="0.32"/>
  <rect x="145" y="175" width="230" height="64" rx="32" fill="#59b6b0" opacity="0.95"/>
  <text x="260" y="217" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" font-weight="800" fill="#ffffff">方法 3</text>
  <text x="910" y="220" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="34" font-weight="800" fill="#1f2937" opacity="0.42">07/08</text>
  <text x="145" y="420" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="86" font-weight="900" fill="#111827"><tspan x="145" dy="0">いつもと違う行動を</tspan><tspan x="145" dy="104.92">1ミリ選ぶ</tspan></text>
  <rect x="145" y="650" width="130" height="8" rx="4" fill="#59b6b0"/>
  <text x="145" y="760" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="45" font-weight="650" fill="#374151"><tspan x="145" dy="0">我慢しがちな人は、一言だけ本音を。</tspan><tspan x="145" dy="69.75">強く言いがちな人は、返事の前に3秒。</tspan><tspan x="145" dy="69.75">大きな決意より、</tspan><tspan x="145" dy="69.75">小さな選択を積み重ねる。</tspan></text>
  <rect x="145" y="1080" width="790" height="88" rx="24" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="540" y="1136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="31" font-weight="800" fill="#1f2937">変化は1ミリからでいい</text>
</svg>
